services:
  - type: web
    name: travel-concierge-adk
    runtime: python
    plan: free
    buildCommand: uv sync --dev
    startCommand: uv run uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GOOGLE_API_KEY
        sync: false
      - key: WEATHER_PROVIDER
        value: demo