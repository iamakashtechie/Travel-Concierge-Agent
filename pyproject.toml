[project]
name = "travel-concierge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "google-adk>=2.10.0",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]